<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Waste Management Dashboard</title>



<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

html,body{
 width:100%;
 height:100%;
 margin:0;
 background:linear-gradient(135deg,#04145b,#045372,#0d8aa4);
}

body{
 padding:1.2vh 1.2vw;
 overflow:hidden;
 display:flex;
}

.dashboard{
 width:100%;
 height:100%;
 margin:auto;
 border:2px solid rgba(255,255,255,.2);
 border-radius:25px;
 padding:1.2vh 1.2vw;
 display:flex;
 flex-direction:column;
}

/* HEADER */

.header{
    display:flex;
    align-items:center;
    gap:1.5vw;
    margin-bottom:1.2vh;
}

.logo-box{
    width:16vw;
    max-width:280px;
    height:9vh;
    max-height:100px;
    background:white;
    border-radius:18px;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-shrink:0;
}

.logo-box img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.title{
    color:white;
    font-size:clamp(24px, 3.4vw, 55px);
    font-weight:900;
}

/* DATE */

.date-row{
    margin-bottom:1.2vh;
    color:white;
    font-size:clamp(16px, 1.6vw, 26px);
    font-weight:bold;
    display:flex;
    align-items:center;
}

.date-row input{
    width:250px;
    max-width:20vw;
    height:5vh;
    max-height:42px;
    border:none;
    border-radius:8px;
    padding:8px 12px;
    font-size:clamp(14px, 1.1vw, 18px);
    margin-left:8px;
}

/* MAIN CONTENT */

.main-content{
 display:grid;
 grid-template-columns:55% 45%;
 gap:1.2vw;
 flex:1;
 min-height:0;
}
/* WASTE SIDE */

.waste-section{
    display:flex;
    flex-direction:column;
    gap:1.2vh;
    height:100%;
}

.card{
    padding:0.8vh 0.8vw;
    border-radius:16px;
    color:white;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.card-title{
    font-size:clamp(14px, 1.3vw, 20px);
    font-weight:700;
    margin-bottom:0.6vh;
}

.input-row{
    position:relative;
}

.input-row input{
    width:100%;
    height:5vh;
    min-height:34px;
    border:none;
    border-radius:10px;
    padding:10px 75px 10px 15px;
    font-size:clamp(15px, 1.4vw, 22px);
    font-weight:700;
}

.unit{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    font-size:clamp(14px, 1.2vw, 20px);
    color:#444;
    font-weight:900;
}

/* COLORS */

.dry{
    background:#9C6B30;
}

.wet{
    background:#22B14C;
}

.ewaste{
    background:#2E86FF;
}

.plastic{
    background:#E6B800;
}

.recyclable{
    background:#00B894;
}

.hazardous{
    background:#E53935;
}

/* CHART */

.chart-panel{
 background:white;
 border-radius:20px;
 padding:1.2vh 1.2vw;
 display:flex;
 flex-direction:column;
 height:100%;
 min-height:0;
}


.chart-title{
    text-align:center;
    font-size:clamp(18px, 2vw, 28px);
    font-weight:800;
    margin-bottom:1vh;
    flex-shrink:0;
}

.chart-container{
    flex:1;
    min-height:0;
    position:relative;
}

/* TOTAL */

.total-section{
    margin-top:1.2vh;
    background:white;
    border-radius:18px;
    padding:1.6vh 1.6vw;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-shrink:0;
}

.total-title{
    font-size:clamp(16px, 2vw, 28px);
    font-weight:900;
}

.total-value{
    font-size:clamp(22px, 3vw, 42px);
    font-weight:900;
    color:#003c96;
}


/* Portrait / narrow fallback (phones, small windows) */
@media (max-aspect-ratio: 4/3), (max-width: 1100px){

    body{
        overflow-y:auto;
        overflow-x:hidden;
        display:block;
    }

    .dashboard{
        height:auto;
        min-height:100%;
    }

    .main-content{
        grid-template-columns:1fr;
        flex:none;
    }

    .chart-container{
        height:360px;
    }

    .waste-section{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:8px;
        height:auto;
    }

    .card{
        flex:none;
    }

    .total-section{
        margin-top:8px;
    }
}

</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
</head>
<body>

<div class="dashboard">

    <div class="header">

        <div class="logo-box">
<img
src="https://tse4.mm.bing.net/th/id/OIP.CZtmhzTvTCNsBeAWZ7BhigHaEK?r=0&w=1536&h=864&rs=1&pid=ImgDetMain&o=7&rm=3"
alt="Logo">
</div>

        <div class="title">
            WASTE MANAGEMENT
        </div>

    </div>

    <div class="date-row">
        Date :
        <input type="text" placeholder="Enter Date">
    </div>

    <div class="main-content">

        <div class="waste-section">

            <div class="card dry">
                <div class="card-title">🟤 Dry Waste</div>
                <div class="input-row">
                    <input type="number" class="wasteInput">
                    <span class="unit">KG</span>
                </div>
            </div>

            <div class="card wet">
                <div class="card-title">🟢 Wet Waste</div>
                <div class="input-row">
                    <input type="number" class="wasteInput">
                    <span class="unit">KG</span>
                </div>
            </div>

            <div class="card ewaste">
                <div class="card-title">🔵 E-Waste</div>
                <div class="input-row">
                    <input type="number" class="wasteInput">
                    <span class="unit">KG</span>
                </div>
            </div>

            <div class="card plastic">
                <div class="card-title">🟡 Plastic Waste</div>
                <div class="input-row">
                    <input type="number" class="wasteInput">
                    <span class="unit">KG</span>
                </div>
            </div>

            <div class="card recyclable">
                <div class="card-title">♻ Food Waste</div>
                <div class="input-row">
                    <input type="number" class="wasteInput">
                    <span class="unit">KG</span>
                </div>
            </div>

            <div class="card hazardous">
                <div class="card-title">🔴 Hazardous Waste</div>
                <div class="input-row">
                    <input type="number" class="wasteInput">
                    <span class="unit">KG</span>
                </div>
            </div>

        </div>

        <div class="chart-panel">

            <div class="chart-title">
                Waste Distribution
            </div>

            <div class="chart-container">
                <canvas id="pieChart"></canvas>
            </div>

        </div>

    </div>

    <div class="total-section">

        <div class="total-title">
            TOTAL WASTE GENERATED TODAY
        </div>

        <div id="totalWaste" class="total-value">
            0 KG
        </div>

    </div>

</div>

<script>

const wasteInputs = document.querySelectorAll('.wasteInput');
const totalWasteElement = document.getElementById('totalWaste');

/* Register Plugin */
Chart.register(ChartDataLabels);

const pieChart = new Chart(
    document.getElementById('pieChart'),
    {
        type: 'pie',

        data: {
            labels: [
                'Dry Waste',
                'Wet Waste',
                'E-Waste',
                'Plastic Waste',
                'Food Waste',
                'Hazardous Waste'
            ],

            datasets: [{
                data: [0, 0, 0, 0, 0, 0],

                backgroundColor: [
                    '#9C6B30',
                    '#22B14C',
                    '#2E86FF',
                    '#E6B800',
                    '#00B894',
                    '#E53935'
                ],

                borderColor: '#fff',
                borderWidth: 3
            }]
        },

        
        options:{
            responsive:true,
            maintainAspectRatio:false,

            devicePixelRatio: 3,


            plugins: {

                legend: {
                    position: 'bottom',
                    labels: {
                        font: {
                            size: 18,
                            weight: 'bold'
                        }
                    }
                },

                datalabels: {

    color: "#FFFFFF",

    textStrokeColor: "#000000",
    textStrokeWidth: 2,

    font: {
        size: 18,
        weight: "bold"
    },

    formatter: function(value, context){

        if(value === 0) return "";

        const data =
        context.chart.data.datasets[0].data;

        const total =
        data.reduce((a,b)=>a+b,0);

        const percentage =
        ((value/total)*100).toFixed(1);

        return value + " KG (" + percentage + "%)";
    }
}
            }
        }
    }
);

function updateDashboard() {

    let values = [];
    let total = 0;

    wasteInputs.forEach(input => {

        const value =
            parseFloat(input.value) || 0;

        values.push(value);

        total += value;
    });

    totalWasteElement.textContent =
        total.toFixed(2) + ' KG';

    pieChart.data.datasets[0].data =
        values;

    pieChart.update();
}

wasteInputs.forEach(input => {

    input.addEventListener(
        'input',
        updateDashboard
    );

});

updateDashboard();

</script>

</body>
</html>
